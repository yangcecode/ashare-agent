<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 股助理</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2230; --line: #262d3a;
    --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --up: #f85149; --down: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); color: var(--dim); }
  .pill.on { background: #1f6feb33; color: var(--accent); }
  .pill.busy { background: #d2992233; color: var(--warn); }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  aside { width: 340px; border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 16px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .msg { margin-bottom: 16px; max-width: 900px; }
  .who { font-size: 11px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .body { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .body { background: #1f6feb1a; border-color: #1f6feb44; }
  .msg.tool .body { background: transparent; border-style: dashed; color: var(--dim); font-size: 13px; }
  .msg.sys .body { background: transparent; border: none; color: var(--dim); font-size: 12px; padding: 2px 0; }
  .toolcall { display: inline-block; font-size: 12px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; color: var(--accent); font-family: ui-monospace, Consolas, monospace; }
  .child { border-left: 2px solid var(--accent); margin: 8px 0 8px 8px; padding-left: 10px; }
  .child .name { font-size: 12px; color: var(--accent); font-weight: 600; }
  .child .preview { font-size: 12px; color: var(--dim); white-space: pre-wrap; margin-top: 2px; }
  footer { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 46px; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #04121f; border: none; border-radius: 8px; padding: 0 18px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: var(--panel2); color: var(--fg); font-weight: 400; padding: 0 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .wl-item, .fd { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .fd .when { color: var(--dim); font-size: 11px; }
  .fd .sum { color: var(--fg); }
  .tag { font-size: 11px; background: var(--panel2); border-radius: 4px; padding: 1px 6px; margin-right: 4px; color: var(--dim); }
  .stance { font-size: 11px; padding: 1px 6px; border-radius: 4px; }
  .s-偏多 { background: #f8514922; color: var(--up); }
  .s-偏空 { background: #3fb95022; color: var(--down); }
  .s-观望, .s-中性 { background: #d2992222; color: var(--warn); }
  .running { color: var(--warn); }
  .cursor::after { content: "▋"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: var(--dim); font-size: 13px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>A 股助理</h1>
  <span class="pill" id="p-conn">连接中…</span>
  <span class="pill" id="p-busy">空闲</span>
  <span class="pill" id="p-conv"></span>
  <button class="ghost" id="b-stop" style="margin-left:auto">停</button>
</header>

<main>
  <div id="chat"></div>
  <aside>
    <h2>自选股</h2>
    <div id="wl"></div>
    <form id="f-wl" style="display:flex;gap:6px;margin-top:8px">
      <input id="i-wl" placeholder="600519 510300" style="flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 8px;font:inherit">
      <button type="submit">加</button>
    </form>
    <h2>档案 <span id="fd-n" class="pill"></span></h2>
    <div id="fd"></div>
    <h2>子 agent</h2>
    <div id="kids"></div>
    <h2>用量</h2>
    <div id="usage" class="empty">—</div>
  </aside>
</main>

<footer>
  <textarea id="in" placeholder="看看我的自选，有异动的深挖一下…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="b-send">发</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let latest = null;
let lastRenderedIds = "";

function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// ---- 渲染 chat ----
function renderChat(s) {
  const ids = s.entries.map((e) => e.id).join(",");
  if (ids !== lastRenderedIds) {
    lastRenderedIds = ids;
    const html = [];
    for (const e of s.entries) {
      if (e.kind === "pi.system") continue;
      const cls = e.kind === "pi.user" ? "user" : e.kind === "pi.tool-result" ? "tool" : e.kind === "pi.assistant" ? "ai" : "sys";
      const who = { "pi.user": "你", "pi.assistant": "助理", "pi.tool-result": "工具", "pi.system": "系统" }[e.kind] ?? e.kind;
      const calls = e.tools.map((t) =>
        `<div class="toolcall">${esc(t.name)}(${esc(JSON.stringify(t.args ?? {}).slice(0, 120))})</div>`).join("");
      const text = e.text ? esc(e.text) : "";
      if (!text && !calls) continue;
      html.push(`<div class="msg ${cls}"><div class="who">${esc(who)}</div>${calls}<div class="body">${text}</div></div>`);
    }
    $("chat").innerHTML = html.join("") || `<div class="empty">还没有对话。下面输入一句话开始，比如「看看我的自选」。</div>`;
  }

  // 流式部分单独一个节点，每帧只换它，不重建整份 transcript。
  let tail = $("live-tail");
  if (!tail) {
    tail = document.createElement("div");
    tail.id = "live-tail";
    $("chat").appendChild(tail);
  }
  const parts = [];
  if (s.live.partial) {
    parts.push(`<div class="msg ai"><div class="who">助理</div><div class="body cursor">${esc(s.live.partial)}</div></div>`);
  }
  if (s.live.tools.length) {
    parts.push(`<div class="msg tool running"><div class="who">正在跑</div><div class="body">${
      s.live.tools.map((t) => esc(t.name) + " · " + esc(t.status)).join("<br>")}</div></div>`);
  }
  const next = parts.join("");
  if (tail.dataset.html !== next) {
    tail.dataset.html = next;
    tail.innerHTML = next;
  }

  const chat = $("chat");
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
  if (atBottom) chat.scrollTop = chat.scrollHeight;
}

// ---- 渲染侧栏 ----
function renderSide(s) {
  $("wl").innerHTML = s.watchlist.length
    ? s.watchlist.map((c) => `<div class="wl-item">${esc(c)} <button class="ghost" style="float:right;padding:0 8px" data-rm="${esc(c)}">删</button></div>`).join("")
    : `<div class="empty">空的，加几只</div>`;

  const fd = $("fd");
  $("fd-n").textContent = s.findings.length ? String(s.findings.length) : "";
  fd.innerHTML = s.findings.length ? s.findings.map((f) => `
    <div class="fd">
      <div class="when">${esc(f.at.slice(0, 16).replace("T", " "))} · ${esc(f.code)}
        ${f.stance ? `<span class="stance s-${esc(f.stance)}">${esc(f.stance)}</span>` : ""}</div>
      <div class="sum">${esc(f.summary)}</div>
      ${(f.tags ?? []).length ? `<div>${f.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    </div>`).join("") : `<div class="empty">还没有记录。值得记的结论会自动进来。</div>`;

  const names = Object.keys(s.children ?? {});
  $("kids").innerHTML = names.length ? names.map((n) => {
    const k = s.children[n];
    return `<div class="child"><div class="name">${esc(n)} <span class="tag">#${k.conversationId} · ${k.entries} 条</span></div>
      <div class="preview">${esc((k.preview || "（还没有输出）").slice(0, 300))}</div></div>`;
  }).join("") : `<div class="empty">还没有派过子 agent。</div>`;

  const usage = Object.entries(s.usage ?? {});
  $("usage").innerHTML = usage.length ? usage.map(([k, v]) =>
    `<div style="font-size:12px">${esc(k)}<br>${v.input} in / ${v.output} out · 缓存读 ${v.cacheRead ?? 0}<br>成本 $${(v.cost?.total ?? 0).toFixed(4)}</div>`).join("")
    : `<div class="empty">—</div>`;
}

function render(s) {
  // 帧可能是轻量的（只有 entries/live）也可能是完整的（带侧栏）。合并而不是替换。
  latest = { ...(latest ?? {}), ...s };
  const st = latest;
  $("p-conv").textContent = "对话 #" + st.conversationId;
  $("p-busy").textContent = st.live?.running ? "运行中" : "空闲";
  $("p-busy").className = "pill" + (st.live?.running ? " busy" : "");
  $("b-stop").disabled = !st.live?.running;
  $("b-send").disabled = !!st.live?.running;
  if (st.entries) renderChat(st);
  if (st.watchlist) renderSide(st);
}

// ---- SSE ----
const es = new EventSource("/api/stream");
es.onopen = () => { $("p-conn").textContent = "已连接"; $("p-conn").className = "pill on"; };
es.onerror = () => { $("p-conn").textContent = "断开"; $("p-conn").className = "pill"; };
es.onmessage = (ev) => render(JSON.parse(ev.data));

// ---- 交互 ----
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
  if (!r.ok) console.error(path, await r.text());
  return r;
}

$("b-send").onclick = async () => {
  const el = $("in");
  const content = el.value.trim();
  if (!content) return;
  el.value = "";
  await post("/api/say", { content });
};
$("in").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("b-send").click(); }
};
$("b-stop").onclick = () => post("/api/stop");
$("f-wl").onsubmit = async (e) => {
  e.preventDefault();
  const codes = $("i-wl").value.trim().toUpperCase().split(/[\s,，]+/).filter(Boolean);
  if (!codes.length) return;
  $("i-wl").value = "";
  render(await (await post("/api/watch", { codes })).json());
};
$("wl").onclick = async (e) => {
  const c = e.target.dataset?.rm;
  if (!c) return;
  render(await (await post("/api/watch", { codes: [c], action: "remove" })).json());
};
</script>
</body>
</html>
